[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "competing-event-probabilities"
version = "0.1.0"
description = "Exact-count competing-event incidence with tie conventions and censoring counterexamples"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "matplotlib>=3.10", "numpy>=2.2,<3"]

[project.scripts]
competing-events = "competing_events.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
